<!DOCTYPE html>
<html lang="de">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Johanns Reise zu Obelia</title>
<style>
:root{--bg:#070b1f;--bg2:#0f1640;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.14);--txt:#eef2ff;--mut:#a9b4e8;--neon:#5cf2ff;--pink:#ff5ca8;--yel:#ffe066;--pro:#ff4d6d;--neu:#9aa5b8;--ele:#4dd8ff;
--am:#ff6b6b;--ae:#ffa94d;--tm:#ffd43b;--pt:#69db7c;--md:#38d9a9;--nm:#4dabf7;--hl:#9775fa;--ng:#f783ac;--la:#66d9e8;--ac:#e599f7}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Trebuchet MS","Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;color:var(--txt);font-size:19px;line-height:1.5;
background:radial-gradient(1200px 700px at 80% -10%,#2a1b6b 0%,transparent 60%),radial-gradient(900px 600px at -10% 30%,#0d3b66 0%,transparent 55%),var(--bg);min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;top:0;right:0;bottom:0;left:0;inset:0;pointer-events:none;z-index:0;opacity:.8;
background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 120px 80px,#cfe,transparent),radial-gradient(1.5px 1.5px at 200px 160px,#fff,transparent),radial-gradient(1px 1px at 300px 40px,#fde,transparent),radial-gradient(1px 1px at 360px 220px,#fff,transparent),radial-gradient(1.5px 1.5px at 80px 260px,#def,transparent);background-size:400px 300px;animation:tw 6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.45}to{opacity:.9}}
main,header,footer{position:relative;z-index:1}
b{color:#fff}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(7,11,31,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:20px;white-space:nowrap;background:linear-gradient(90deg,var(--neon),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav a{color:var(--mut);text-decoration:none;padding:8px 12px;border-radius:999px;font-size:16px;white-space:nowrap;transition:.2s}
nav a:hover,nav a.on{color:#fff;background:rgba(92,242,255,.15)}
.lang{display:flex;border:2px solid var(--neon);border-radius:999px;overflow:hidden;flex:none}
.lang button{all:unset;cursor:pointer;padding:6px 12px;font-weight:800;font-size:15px;color:var(--neon)}
.lang button.on{background:var(--neon);color:#071028}
section{max-width:1180px;margin:0 auto;padding:56px 18px}
h1{font-size:clamp(34px,6vw,64px);line-height:1.08;margin:.2em 0;background:linear-gradient(90deg,#fff,var(--neon) 40%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:clamp(28px,4vw,42px);margin:0 0 12px}
h2 .em{display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(6deg)}}
.lead{font-size:clamp(18px,2.2vw,22px);color:#dfe5ff;max-width:860px}
.kicker{color:var(--yel);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:15px}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:center;min-height:calc(100vh - 60px)}
.hero svg{width:100%;max-width:420px;filter:drop-shadow(0 0 30px rgba(92,242,255,.35))}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;cursor:pointer;font:inherit;font-weight:800;font-size:19px;color:#071028;background:linear-gradient(90deg,var(--neon),#8affc1);padding:14px 26px;border-radius:999px;box-shadow:0 6px 24px rgba(92,242,255,.35);transition:transform .15s,box-shadow .15s;touch-action:manipulation;text-decoration:none}
.btn:hover{transform:translateY(-2px) scale(1.03)}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--txt);border:2px solid var(--line);box-shadow:none}
.btn.sm{font-size:16px;padding:9px 16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;transition:transform .25s,border-color .25s}
.card:hover{transform:translateY(-4px);border-color:rgba(92,242,255,.5)}
.card h3{margin:0 0 6px;font-size:22px}
.card p{margin:0;color:#d6dcff}
.dot{display:inline-block;width:22px;height:22px;border-radius:50%;vertical-align:-4px;margin-right:6px;box-shadow:0 0 12px currentColor}
.dot.p{background:var(--pro);color:var(--pro)}.dot.n{background:var(--neu);color:var(--neu)}.dot.e{background:var(--ele);color:var(--ele)}.dot.s{border:3px dashed var(--neon);color:transparent}
.split{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:center}
.note{background:linear-gradient(90deg,rgba(255,92,168,.15),rgba(92,242,255,.12));border:1px solid var(--line);border-radius:18px;padding:14px 18px;margin-top:18px}
.bohr{width:100%;max-width:340px;display:block;margin:0 auto}
.bohr .orbit{fill:none;stroke:rgba(92,242,255,.35);stroke-width:1.5;stroke-dasharray:4 5}
.bohr .el{fill:var(--ele);filter:url(#glow)}.bohr .el.out{fill:var(--yel)}
.bohr .pr{fill:var(--pro)}.bohr .nu{fill:var(--neu)}
.bohr text{font-weight:800;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.figcap{text-align:center;color:var(--mut);font-size:16px;margin-top:6px}
/* builder */
.builder{display:grid;grid-template-columns:1fr 1.1fr;gap:24px;align-items:start;margin-top:18px}
.ctrl{display:grid;gap:12px}
.ctrlrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 14px}
.ctrlrow .lab{flex:1;font-weight:800;font-size:20px}
.ctrlrow .num{min-width:52px;text-align:center;font-size:30px;font-weight:900}
.pm{width:54px;height:54px;border-radius:50%;border:none;font-size:30px;font-weight:900;cursor:pointer;color:#071028;touch-action:manipulation;transition:transform .1s}
.pm:active{transform:scale(.88)}
.pm.p{background:var(--pro)}.pm.n{background:var(--neu)}.pm.e{background:var(--ele)}
.readout{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px}
.bigsym{font-size:64px;font-weight:900;line-height:1;margin:4px 0}
.bigname{font-size:26px;font-weight:800}
.pill{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:800;font-size:16px;margin:4px 2px;background:rgba(255,255,255,.1)}
.pill.ok{background:rgba(105,219,124,.25);color:#b6ffc4}.pill.pos{background:rgba(255,77,109,.25);color:#ffc2cf}.pill.neg{background:rgba(77,216,255,.25);color:#c4f3ff}
.hint{font-size:16px;color:#d6dcff;margin-top:8px;min-height:2.6em}
.missions{display:grid;gap:8px}
.mission{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:16px}
.mission.done{border-color:#69db7c;background:rgba(105,219,124,.12)}
.mission .ck{font-size:20px;line-height:1.2}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
/* table */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:10px 4px 14px;margin:0 -4px}
.ptable{--c:clamp(34px,5.1vw,60px);display:grid;grid-template-columns:18px repeat(18,var(--c));grid-template-rows:18px repeat(7,var(--c)) 12px repeat(2,var(--c));gap:3px;width:max-content;margin:0 auto}
.ptable.mini{--c:clamp(24px,3.6vw,40px);gap:2px}
.ptable .lbl{font-size:11px;color:var(--mut);display:flex;align-items:center;justify-content:center;font-weight:800}
.cell{position:relative;border:1.5px solid var(--cc);background:color-mix(in srgb,var(--cc) 22%,transparent);background-color:rgba(255,255,255,.06);border-radius:8px;color:#fff;padding:0;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .15s,opacity .3s,box-shadow .2s,filter .3s;touch-action:manipulation;overflow:hidden;line-height:1}
@supports (background:color-mix(in srgb,red 20%,transparent)){.cell{background:color-mix(in srgb,var(--cc) 22%,transparent)}}
.cell:hover,.cell:focus-visible{transform:scale(1.18);z-index:3;box-shadow:0 0 18px var(--cc);outline:none}
.cell .cz{position:absolute;top:2px;left:3px;font-size:calc(var(--c)*.2);opacity:.85}
.cell .cs{font-weight:900;font-size:calc(var(--c)*.4)}
.cell .cn{font-size:calc(var(--c)*.15);opacity:.85;margin-top:2px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.mini .cell .cn,.mini .cell .cz{display:none}.mini .cell .cs{font-size:calc(var(--c)*.42)}
.cell.ph{cursor:default;opacity:.7;border-style:dashed}.cell.ph .cs{font-size:calc(var(--c)*.2)}
.cell.ph:hover{transform:none;box-shadow:none}
.ptable.dimmed .cell:not(.hi){opacity:.18;filter:grayscale(.7)}
.cell.hi{box-shadow:0 0 14px var(--cc),inset 0 0 10px var(--cc);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 26px var(--cc),inset 0 0 14px var(--cc)}}
.cell.good{--cc:#69db7c!important;animation:pop .5s}.cell.bad{--cc:#ff4d6d!important;animation:shake .4s}
@keyframes pop{50%{transform:scale(1.4)}}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.c-am{--cc:var(--am)}.c-ae{--cc:var(--ae)}.c-tm{--cc:var(--tm)}.c-pt{--cc:var(--pt)}.c-md{--cc:var(--md)}.c-nm{--cc:var(--nm)}.c-hl{--cc:var(--hl)}.c-ng{--cc:var(--ng)}.c-la{--cc:var(--la)}.c-ac{--cc:var(--ac)}
.legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 4px}
.legend button{font:inherit;font-size:15px;color:#fff;cursor:pointer;border:1.5px solid var(--cc);background:rgba(255,255,255,.05);border-radius:999px;padding:6px 12px;display:flex;align-items:center;gap:6px;touch-action:manipulation}
.legend button i{width:12px;height:12px;border-radius:50%;background:var(--cc);display:inline-block}
.legend button.on{background:var(--cc);color:#071028;font-weight:800}
.small{font-size:15px;color:var(--mut);text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.chip{font:inherit;font-weight:800;font-size:17px;min-width:52px;min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:#fff;cursor:pointer;padding:6px 12px;transition:.2s;touch-action:manipulation}
.chip.on{border-color:var(--neon);background:rgba(92,242,255,.2);box-shadow:0 0 16px rgba(92,242,255,.4)}
.infobox{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:16px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}
.pair .bohr{max-width:240px}
.scene{margin-top:12px;padding:14px;border-radius:16px;background:rgba(0,0,0,.25);text-align:center;font-size:20px;font-weight:800;overflow:hidden;position:relative;min-height:70px}
.scene .emo{display:inline-block;font-size:36px;margin:0 6px}
.zoom{animation:zoom 1.6s ease-in-out infinite alternate}@keyframes zoom{from{transform:translateX(-40px) rotate(-10deg)}to{transform:translateX(40px) rotate(10deg)}}
.boom{animation:boom 1s ease-in-out infinite}@keyframes boom{50%{transform:scale(1.5)}}
.zzz{animation:zzz 2.5s ease-in-out infinite}@keyframes zzz{50%{transform:translateY(-8px);opacity:.5}}
.yl{color:var(--yel);font-weight:800}
/* modal */
.modal{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(3,6,20,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:14px}
.modal.open{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.panel{position:relative;width:min(880px,100%);max-height:calc(100vh - 28px);overflow:auto;border-radius:26px;background:linear-gradient(160deg,#151f5c,#0a0f2e);border:2px solid var(--cc);box-shadow:0 0 50px color-mix(in srgb,var(--cc) 50%,transparent);padding:22px;animation:rise .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes rise{from{transform:translateY(30px) scale(.94);opacity:0}}
.panel .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:center}
.ptile{width:120px;height:120px;border-radius:20px;border:3px solid var(--cc);display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.06);box-shadow:0 0 24px var(--cc);position:relative}
.ptile .s{font-size:54px;font-weight:900;line-height:1}.ptile .z{position:absolute;top:6px;left:10px;font-weight:800}
.phead{display:flex;gap:18px;align-items:center}
.phead h3{margin:0;font-size:32px}.phead .alt{color:var(--mut);font-size:18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.stat{background:rgba(255,255,255,.06);border-radius:14px;padding:8px 12px}
.stat .k{font-size:14px;color:var(--mut)}.stat .v{font-size:22px;font-weight:900}
.fact{background:rgba(255,224,102,.1);border:1px solid rgba(255,224,102,.4);border-radius:16px;padding:12px 14px;margin-top:10px}
.fact b{color:var(--yel)}
.pnav{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.xbtn{position:absolute;top:12px;right:12px}
/* quiz */
.quizbox{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px;margin-top:16px}
.qtop{display:flex;justify-content:space-between;color:var(--mut);font-weight:800;font-size:16px}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin:8px 0 14px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--neon),var(--pink));transition:width .4s}
.qq{font-size:clamp(22px,3vw,30px);font-weight:800;margin:4px 0 14px}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-size:20px;text-align:left;padding:14px 18px;border-radius:16px;border:2px solid var(--line);background:rgba(255,255,255,.05);color:#fff;cursor:pointer;transition:.2s;touch-action:manipulation}
.opt:hover:not(:disabled){border-color:var(--neon);transform:translateX(4px)}
.opt.good{border-color:#69db7c;background:rgba(105,219,124,.25)}.opt.bad{border-color:#ff4d6d;background:rgba(255,77,109,.2)}
.fb{margin-top:14px;font-size:19px;min-height:1.5em}
.fb .r{color:#8cff9e;font-weight:900}.fb .w{color:#ff8fa3;font-weight:900}
.result{text-align:center}.result .trophy{font-size:90px;animation:bob 2s ease-in-out infinite;display:inline-block}
#confetti{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;pointer-events:none;z-index:100}
footer{text-align:center;color:var(--mut);padding:30px 10px 50px;font-size:16px}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}.reveal.vis{opacity:1;transform:none}
@media (max-width:820px){.hero,.split,.builder,.panel .grid{grid-template-columns:1fr}.hero{min-height:auto}.hero svg{max-width:300px;margin:0 auto;display:block}.logo{display:none}body{font-size:18px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---- Obelia additions (same design language) ---- */
:root{--peri:#e0a74b;--coen:#ff9fb8;--gas:#6b3fa0}
.hero svg.heroart{max-width:440px}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:22px}
.step{counter-increment:s;position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 20px 20px 70px}
.step:before{content:counter(s);position:absolute;left:16px;top:16px;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--neon),var(--pink));color:#071028;font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center}
.step h3{margin:0 0 4px;font-size:21px}.step p{margin:0;color:#d6dcff}
.warn{background:rgba(255,77,109,.12);border:1px solid rgba(255,77,109,.5);border-radius:18px;padding:14px 18px;margin-top:18px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
.compare .card h3{font-size:24px}.compare ul{margin:6px 0 0;padding-left:22px;color:#d6dcff}
.diag{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;align-items:start;margin-top:18px}
.svgbox{background:radial-gradient(500px 360px at 50% 40%,rgba(92,242,255,.14),rgba(0,0,0,.35));border:1px solid var(--line);border-radius:26px;padding:8px;position:relative}
.svgbox svg{width:100%;height:auto;display:block;max-height:78vh;touch-action:manipulation}
.hs{cursor:pointer;-webkit-tap-highlight-color:transparent}
.hs:hover,.hs.sel{filter:drop-shadow(0 0 7px var(--yel)) brightness(1.25)}
.hs.good{filter:drop-shadow(0 0 10px #69db7c) brightness(1.4)}
.hs.bad{filter:drop-shadow(0 0 10px #ff4d6d)}
.badge circle{fill:var(--yel);stroke:#071028;stroke-width:2}.badge text{font-weight:900;font-size:13px;fill:#071028;text-anchor:middle;dominant-baseline:central}.badge line{stroke:var(--yel);stroke-width:1.5}
.badge{pointer-events:none}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.modes .btn.on{background:linear-gradient(90deg,var(--yel),#ffb86b);color:#071028;border-color:transparent}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;justify-content:center}
.partlist{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.partlist button{font:inherit;font-size:15px;color:#fff;cursor:pointer;border:1.5px solid var(--neon);background:rgba(255,255,255,.05);border-radius:999px;padding:6px 12px;touch-action:manipulation}
.partlist button.on{background:var(--neon);color:#071028;font-weight:800}
.big{font-size:26px;font-weight:900}
.target{font-size:clamp(22px,3vw,30px);font-weight:900;color:var(--yel)}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:18px;align-items:start}
.eqn{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:26px;font-weight:900;margin-top:12px}
.eqn .res{color:var(--neon);font-size:40px}
.fov{display:block;margin:10px auto 0;max-width:300px;width:100%}
.cycle{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:18px;align-items:start}
.cards7{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.cc{font:inherit;color:#fff;text-align:left;cursor:pointer;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;touch-action:manipulation;transition:.2s}
.cc:hover:not(:disabled){border-color:var(--neon)}.cc:disabled{opacity:.35}
.cc .em2{font-size:30px;display:block}
.slots{display:grid;gap:8px;margin-top:6px}
.slot{display:flex;gap:10px;align-items:center;min-height:52px;padding:8px 14px;border-radius:16px;border:2px dashed var(--line);color:var(--mut)}
.slot.full{border:2px solid #69db7c;background:rgba(105,219,124,.18);color:#fff}
.slot b.n{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--neon);color:#071028;align-items:center;justify-content:center;flex:none}
select.sel{font:inherit;font-size:20px;font-weight:800;color:#fff;background:rgba(255,255,255,.08);border:2px solid var(--line);border-radius:14px;padding:8px 12px}
select.sel option{color:#000}
@media (max-width:820px){.diag,.calc,.cycle,.compare{grid-template-columns:1fr}}
</style>
</head>

navIntro:"Start",navAnimal:"Tier oder Pflanze?",navWhy:"Warum Obelia?",navTech:"Mikroskopieren",navDiag:"Diagramm",navMag:"Vergrößerung",navCycle:"Lebenszyklus",navQuiz:"Quiz",

animTitle:"Obelia: Tier, nicht Pflanze!",animLead:"Obelia bildet kleine, verzweigte Kolonien, die wie ein feines Pflänzchen aussehen. Sie gehört aber zu den Hydrozoen (Hydrozoa), einer Gruppe der Nesseltiere (Cnidaria) – wie Quallen, Seeanemonen und Korallen.",
plantT:"🌱 Eine Pflanze …",obT:"🪼 Obelia (Tier) …",

whyTitle:"Warum ist Obelia ein Mikroskop-Star?",whyLead:"Obelia ist nur wenige Millimeter bis ein paar Zentimeter groß und fast glasklar. Licht scheint einfach hindurch – so siehst du Dinge, die du bei den meisten Tieren erst aufschneiden müsstest.",

w2t:"🍽️ Fresspolypen",w2:"Die <b>Hydranten</b> (Fresspolypen) haben einen Kranz aus Tentakeln und eine Mundöffnung. Sie fangen die Nahrung der Kolonie.",
w3t:"🫧 Medusenknospen",w3:"In den flaschenförmigen <b>Gonotheken</b> sitzt der <b>Blastostyl</b> – ein Stab, an dem <b>Medusenknospen</b> wachsen. So siehst du die Fortpflanzung live.",

steps:[["Mikroskop vorbereiten","Mit zwei Händen tragen (eine am Stativ, eine unter dem Fuß). Licht einschalten, <b>kleinste Vergrößerung</b> (4×) einrasten lassen."],["Präparat auflegen","Objektträger auf den Objekttisch legen, mit den Klammern festhalten und die Obelia mittig über das Licht schieben."],["Licht einstellen","Helligkeit und Blende (Diaphragma) so einstellen, dass du die Kontur gut siehst. Durchsichtige Objekte zeigen mehr Details bei <b>etwas weniger</b> Licht."],["Scharfstellen","Schau zuerst <b>von der Seite</b> und fahre den Tisch nach oben, bis das Objektiv fast das Glas berührt. Dann durchs Okular schauen und mit dem Grobtrieb langsam <b>auseinanderfahren</b>, bis das Bild scharf wird; danach mit dem Feintrieb verfeinern."],["Von klein nach groß","Interessante Stelle in die Bildmitte schieben, dann auf 10× und zuletzt auf 40× wechseln. Bei starken Vergrößerungen nur noch den <b>Feintrieb</b> benutzen."],["Zeichnen & beschriften","Zeichne mit Bleistift, was du siehst (Hydranten, Gonotheken, Stängel) und notiere die Gesamtvergrößerung dazu."]],
techWarn:"⚠️ <b>Wichtig:</b> Nie mit dem Grobtrieb <i>auf</i> das Präparat zufahren, vor allem nicht bei 40×! Sonst können Objektiv und Objektträger kaputtgehen. Immer vom Objekt <b>weg</b> scharfstellen.",
lookFor:"<b>Darauf kannst du achten:</b> Den Zickzack-Stängel · die Hydranten mit Tentakelkranz · Gonotheken mit Medusenknospen · den dünnen, helleren Rand (Perisark) um das Gewebe · den Hohlraum in der Mitte, der durch den ganzen Stock führt.",
diagTitle:"Die Obelia-Kolonie im Detail",diagLead:"So würdest du sie (stark schematisch) unter dem Mikroskop sehen. Tippe auf einen Teil, um ihn kennenzulernen – oder starte den Suchmodus und finde die Teile selbst!",

cyc:[["🪼","Die erwachsene <b>Meduse</b> gibt Eizellen und Spermien ins Wasser ab."],["🥚","Eine Eizelle wird befruchtet – es entsteht eine <b>Zygote</b>."],["🐛","Aus der Zygote wird eine bewimperte, schwimmende <b>Planula-Larve</b>."],["⚓","Die Larve setzt sich auf einer festen Unterlage fest und wird zum ersten <b>Polypen</b>."],["🌿","Der Polyp wächst durch <b>Knospung</b> zu einer verzweigten Kolonie."],["🫧","In <b>Gonotheken</b> bilden sich am Blastostyl <b>Medusenknospen</b>."],["🌊","Kleine <b>Medusen</b> lösen sich ab und schwimmen davon – der Kreis schließt sich."]],

hydranth:["Hydranth (Fresspolyp)","Der Fresspolyp der Kolonie: ein Körper mit Mund und Tentakelkranz. Er fängt und verdaut Beute für alle.","Ein kleiner Schlauch mit „Krone“ aus Fäden am oberen Ende."],
tentacle:["Tentakel","Fangarme mit Nesselzellen (Nematocysten), die Beute betäuben und festhalten.","Dünne Fäden mit kleinen Knöpfchen – dort sitzen die Nesselzellen."],

gonotheca:["Gonotheka","Eine flaschenförmige Hülle, in der die Medusen entstehen. Sie ist größer und dicker als ein Hydranten-Becher.","Flaschenform mit Hals – oft in der Gabelung am Stängel."],
blastostyle:["Blastostyl","Der Stab in der Gonotheka. Er ist ein umgebauter Polyp ohne Mund und trägt die Medusenknospen.","Ein Stab in der Mitte der Gonotheka, an dem „Perlen“ hängen."],
bud:["Medusenknospe","Junge Medusen, die am Blastostyl heranwachsen. Weiter oben sind sie größer und älter – gleich werden sie freigelassen.","Kleine Kügelchen am Blastostyl, oben größer als unten."],

gastro:["Gastrovaskularraum","Der gemeinsame Hohlraum im Coenosark. Er dient als Darm <i>und</i> als Verteiler: Verdaute Nahrung gelangt durch ihn zu allen Polypen.","Ein durchgehender Kanal in der Mitte des Stängels."]}

navIntro:"Start",navAnimal:"Animal or plant?",navWhy:"Why Obelia?",navTech:"Using the microscope",navDiag:"Diagram",navMag:"Magnification",navCycle:"Life cycle",navQuiz:"Quiz",

heroText:"It looks like a tiny twig – but it's an animal! Obelia is a see-through cnidarian that grows on seaweed, stones and shells in the sea. Under the microscope you can look right inside: feeding polyps, medusa buds and even the digestive channel.",heroBtn:"Let's go ↓",
animTitle:"Obelia: an animal, not a plant!",animLead:"Obelia forms small, branching colonies that look like a delicate little plant. But it belongs to the hydrozoans (Hydrozoa), a group of cnidarians (Cnidaria) – like jellyfish, sea anemones and corals.",
plantT:"🌱 A plant …",obT:"🪼 Obelia (animal) …",
plant:["makes its own food (photosynthesis)","has green chloroplasts","has cell walls made of cellulose","stays put all its life and doesn't catch anything"],

animNote:"<b>Remember:</b> Obelia is a <b>colony</b>: many polyps sit on one shared branching stalk and share one digestive space. The stalk is protected by a see-through coat of <b>chitin</b> – that's why it looks a bit like a plant stem.",
whyTitle:"Why is Obelia a microscope star?",whyLead:"Obelia is only a few millimetres to a few centimetres big and almost glass-clear. Light simply shines through – so you see things you'd have to cut open most animals to find.",
w1t:"💡 See-through",w1:"The coat and tissue are so thin and clear that the microscope's light passes through (transmitted-light microscopy). You see the inside without cutting anything.",

w4t:"🧬 Two body forms",w4:"Polyp (fixed in place) and medusa (free-swimming): Obelia shows both in one life cycle – perfect for comparing.",

const V=[[300,500],[278,410],[322,320],[278,230],[322,140],[300,75]];
const HY=[{tx:222,ty:350,a:-43,v:1},{tx:380,ty:262,a:44,v:2},{tx:220,ty:172,a:-45,v:3},{tx:380,ty:82,a:45,v:4},{tx:300,ty:75,a:0,v:5}];
const GO=[{tx:322,ty:320,a:-60},{tx:278,ty:230,a:60}];
const loc=(g,x,y)=>{const r=g.a*Math.PI/180;return[g.tx+x*Math.cos(r)-y*Math.sin(r),g.ty+x*Math.sin(r)+y*Math.cos(r)]};
function layers(d,w){return['perisarc','coenosarc','gastro'].map((p,i)=>'<path class="hs" data-p="'+p+'" d="'+d+'" fill="none" stroke="'+[C.peri,C.coen,C.gas][i]+'" stroke-width="'+[w,w*.62,w*.28][i]+'" stroke-linecap="round" stroke-linejoin="round"'+(i==2?' opacity=".85"':'')+'/>').join('')}
function badgesSVG(){
  const out=[];
  const grp=(parts,anchors,bx,y0,dy)=>{
    const idx=parts.map((p,i)=>i).sort((a,b)=>anchors[a][1]-anchors[b][1]);
    idx.forEach((i,k)=>{const n=PARTS.indexOf(parts[i])+1,by=y0+k*dy,[ax,ay]=anchors[i];
      out.push('<g class="badge"><line x1="'+ax.toFixed(1)+'" y1="'+ay.toFixed(1)+'" x2="'+bx+'" y2="'+by+'"/><circle cx="'+bx+'" cy="'+by+'" r="12"/><text x="'+bx+'" y="'+by+'">'+n+'</text></g>')});
  };
  const h=HY[0],g=GO[1];
  grp(["tentacle","mouth","hydranth","hydrotheca"],[loc(h,-30,-58),loc(h,0,-52),loc(h,0,-18),loc(h,-16,-14)],36,230,36);
  grp(["gonotheca","blastostyle","bud"],[loc(g,19,-40),loc(g,0,-30),loc(g,12,-52)],560,120,40);
  grp(["perisarc","coenosarc","gastro"],[[301,455],[296,455],[289,455]],520,430,32);
  return out.join('');
}
function colonySVG(badges,hero){
  let s='<svg viewBox="0 -20 600 560" role="img" aria-label="Obelia">';
  s+='<path d="M170,512 Q300,500 430,512" stroke="#7a5a2b" stroke-width="12" fill="none" stroke-linecap="round" opacity=".8"/><path d="M130,530 Q300,515 470,530 L470,545 L130,545Z" fill="rgba(122,90,43,.35)"/>';
  GO.forEach(g=>{s+='<g transform="translate('+g.tx+','+g.ty+') rotate('+g.a+')">'+gonoSVG()+'</g>'});
  s+=layers("M"+V.map(v=>v.join(",")).join(" L"),28);
  HY.forEach(h=>{
    if(h.v<5){const v=V[h.v];s+=layers("M"+v[0]+","+v[1]+" L"+h.tx+","+h.ty,22)}
    s+='<g transform="translate('+h.tx+','+h.ty+') rotate('+h.a+')">'+hydranthSVG()+'</g>';
  });
  if(badges)s+=badgesSVG();
  return s+'</svg>';
}

let mode="explore",sel=null,showBadges=true;
let F={on:false,round:0,score:0,seq:[],missed:false,done:false,msg:""};
const FROUNDS=8;
function drawColony(){$("#colony").innerHTML=colonySVG(showBadges)}
function setHS(root,cls,p,on){root.querySelectorAll('.hs[data-p="'+p+'"]').forEach(e=>e.classList.toggle(cls,on))}
function clearHS(root){root.querySelectorAll(".hs.sel,.hs.good,.hs.bad").forEach(e=>e.classList.remove("sel","good","bad"))}
function renderDiagram(){
  $("#mExplore").textContent=t("mExplore");$("#mFind").textContent=t("mFind");
  $("#mExplore").classList.toggle("ghost",mode!=="explore");$("#mExplore").classList.toggle("on",mode==="explore");
  $("#mFind").classList.toggle("ghost",mode!=="find");$("#mFind").classList.toggle("on",mode==="find");
  $("#bBadges").textContent=t(showBadges?"badgesOn":"badgesOff");
  drawColony();
  const box=$("#diagInfo"),pl=$("#partList");
  if(mode==="explore"){
    pl.style.display="flex";
    pl.innerHTML=PARTS.map((p,i)=>'<button type="button" data-p="'+p+'" class="'+(sel===p?"on":"")+'">'+(i+1)+' · '+pname(p)+'</button>').join("");
    if(sel){const d=T[lang].P[sel];setHS($("#colony"),"sel",sel,true);
      box.innerHTML='<div class="big"><span class="pill">'+(PARTS.indexOf(sel)+1)+'</span> '+d[0]+'</div><p>'+d[1]+'</p><div class="fact"><b>🔬 '+t("inMicro")+':</b> '+d[2]+'</div>'}
    else box.innerHTML='<p>'+t("pickPart")+'</p>';
  }else{
    pl.style.display="none";
    if(!F.on&&!F.done)box.innerHTML='<p>'+t("findIntro")+'</p><button class="btn" type="button" id="fStart">'+t("findStart")+'</button>';
    else if(F.done)box.innerHTML='<div class="result"><div class="trophy">🏆</div><div class="big">'+t("findDone")+' '+F.score+' / '+FROUNDS+'</div></div><button class="btn" type="button" id="fStart">'+t("findAgain")+'</button>';
    else box.innerHTML='<div class="qtop"><span>'+t("findRound")+' '+(F.round+1)+' / '+FROUNDS+'</span><span>'+t("findScore")+': '+F.score+'</span></div><div class="bar"><i style="width:'+(F.round/FROUNDS*100)+'%"></i></div><div class="small" style="text-align:left">'+t("findTap")+'</div><div class="target">'+pname(F.seq[F.round])+'</div><div class="fb">'+F.msg+'</div>';
    const b=$("#fStart");if(b)b.onclick=startFind;
  }
}
function startFind(){F={on:true,round:0,score:0,seq:shuffle(PARTS).slice(0,FROUNDS),missed:false,done:false,msg:""};renderDiagram()}
function colonyClick(p){
  const root=$("#colony");
  if(mode==="explore"){sel=p;clearHS(root);renderDiagram();return}
  if(!F.on)return;
  const tgt=F.seq[F.round];clearHS(root);
  if(p===tgt){
    setHS(root,"good",p,true);if(!F.missed)F.score++;F.msg=t("findRight");
    const done=++F.round>=FROUNDS;
    if(done){F.on=false;F.done=true}
    renderDiagram();setHS($("#colony"),"good",p,true);
    if(done){if(F.score>=6)celebrate()}
    else setTimeout(()=>{F.msg="";F.missed=false;renderDiagram()},800);
  }else{
    F.missed=true;F.msg='<span class="w">'+t("findWrong")+pname(p)+t("findTry")+'</span>';
    renderDiagram();setHS($("#colony"),"bad",p,true);$("#diagInfo").classList.remove("shake");void $("#diagInfo").offsetWidth;$("#diagInfo").classList.add("shake");
  }
}
function hsTarget(e){const el=e.target.closest&&e.target.closest(".hs");return el?el.dataset.p:null}
$("#colony").addEventListener("click",e=>{const p=hsTarget(e);if(p)colonyClick(p)});

  const q=Q[qs.i],d=q[lang],ok=qs.ans.ok;
  if(q.tap){const root=$("#qSvg");setHS(root,"good",q.tap,true);if(!ok)setHS(root,"bad",qs.ans.what,true);root.style.pointerEvents="none"}
  else document.querySelectorAll("#quizBox .opt").forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add("good");else if(i===qs.ans.what)b.classList.add("bad")});
  $("#qFb").innerHTML=(ok?'<span class="r">'+t("right")+'</span>':'<span class="w">'+t("wrong")+'</span>')+d.e;
  $("#qNext").innerHTML='<button class="btn" type="button" id="qNextBtn" style="margin-top:14px">'+(qs.i===Q.length-1?t("finish"):t("next"))+'</button>';
  $("#qNextBtn").onclick=()=>{if(qs.i===Q.length-1)qs.done=true;else qs.i++;qs.ans=null;renderQuiz()};
  if(ok&&fresh&&q.tap)burst&&burst(25);
}
// ---------- text pieces & language
function renderTexts(){
  $("#plantUl").innerHTML=T[lang].plant.map(x=>"<li>"+x+"</li>").join("");
  $("#obUl").innerHTML=T[lang].ob.map(x=>"<li>"+x+"</li>").join("");
  $("#steps").innerHTML=T[lang].steps.map(s=>'<div class="step"><h3>'+s[0]+'</h3><p>'+s[1]+'</p></div>').join("");
}
function applyLang(){
  document.documentElement.lang=lang;
  document.title=t("heroTitle");
  document.querySelectorAll("[data-t]").forEach(el=>{el.innerHTML=t(el.dataset.t)});
  $("#lde").classList.toggle("on",lang==="de");$("#len").classList.toggle("on",lang==="en");
  renderTexts();renderDiagram();renderMag();renderCycle();renderQuiz();
}
function setLang(l){lang=l;if(store)store.setItem("johann-lang",l);applyLang()}

// ---------- confetti
const cv=$("#confetti"),cx=cv.getContext("2d");let parts=[],raf=null;
function sizeCv(){const r=window.devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;cx.setTransform(r,0,0,r,0,0)}
addEventListener("resize",sizeCv);sizeCv();
function burst(n,x,y){
  const cols=["#5cf2ff","#ff5ca8","#ffe066","#69db7c","#9775fa","#ffa94d"];
  for(let i=0;i<n;i++)parts.push({x:x!==undefined?x:innerWidth/2,y:y!==undefined?y:innerHeight*0.45,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[i%cols.length],life:140+Math.random()*60});
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+40);
  raf=parts.length?requestAnimationFrame(tick):(cx.clearRect(0,0,innerWidth,innerHeight),null);
}
function celebrate(){let k=0;const iv=setInterval(()=>{burst(70,Math.random()*innerWidth,innerHeight*0.3);if(++k>5)clearInterval(iv)},280)}


// ---------- reveal + nav highlight
const io="IntersectionObserver" in window?new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting)en.target.classList.add("vis")}),{threshold:.08}):null;
document.querySelectorAll(".reveal").forEach(s=>io?io.observe(s):s.classList.add("vis"));
const navIo="IntersectionObserver" in window?new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+en.target.id))}}),{rootMargin:"-45% 0px -50% 0px"}):null;
document.querySelectorAll("main section[id]").forEach(s=>navIo&&navIo.observe(s));
// ---------- init
$("#heroArt").innerHTML=colonySVG(false).replace('<svg ','<svg class="heroart" ');
$("#medArt").innerHTML=medusaSVG();
$("#lde").onclick=()=>setLang("de");$("#len").onclick=()=>setLang("en");
applyLang();

</script>
</body>
