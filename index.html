<!DOCTYPE html>
<html lang="de">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Johanns Reise ins Periodensystem</title>
<style>
:root{--bg:#070b1f;--bg2:#0f1640;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.14);--txt:#eef2ff;--mut:#a9b4e8;--neon:#5cf2ff;--pink:#ff5ca8;--yel:#ffe066;--pro:#ff4d6d;--neu:#9aa5b8;--ele:#4dd8ff;
--am:#ff6b6b;--ae:#ffa94d;--tm:#ffd43b;--pt:#69db7c;--md:#38d9a9;--nm:#4dabf7;--hl:#9775fa;--ng:#f783ac;--la:#66d9e8;--ac:#e599f7}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Trebuchet MS","Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;color:var(--txt);font-size:19px;line-height:1.5;
background:radial-gradient(1200px 700px at 80% -10%,#2a1b6b 0%,transparent 60%),radial-gradient(900px 600px at -10% 30%,#0d3b66 0%,transparent 55%),var(--bg);min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;top:0;right:0;bottom:0;left:0;inset:0;pointer-events:none;z-index:0;opacity:.8;
background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 120px 80px,#cfe,transparent),radial-gradient(1.5px 1.5px at 200px 160px,#fff,transparent),radial-gradient(1px 1px at 300px 40px,#fde,transparent),radial-gradient(1px 1px at 360px 220px,#fff,transparent),radial-gradient(1.5px 1.5px at 80px 260px,#def,transparent);background-size:400px 300px;animation:tw 6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.45}to{opacity:.9}}
main,header,footer{position:relative;z-index:1}
b{color:#fff}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(7,11,31,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:20px;white-space:nowrap;background:linear-gradient(90deg,var(--neon),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav a{color:var(--mut);text-decoration:none;padding:8px 12px;border-radius:999px;font-size:16px;white-space:nowrap;transition:.2s}
nav a:hover,nav a.on{color:#fff;background:rgba(92,242,255,.15)}
.lang{display:flex;border:2px solid var(--neon);border-radius:999px;overflow:hidden;flex:none}
.lang button{all:unset;cursor:pointer;padding:6px 12px;font-weight:800;font-size:15px;color:var(--neon)}
.lang button.on{background:var(--neon);color:#071028}
section{max-width:1180px;margin:0 auto;padding:56px 18px}
h1{font-size:clamp(34px,6vw,64px);line-height:1.08;margin:.2em 0;background:linear-gradient(90deg,#fff,var(--neon) 40%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:clamp(28px,4vw,42px);margin:0 0 12px}
h2 .em{display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(6deg)}}
.lead{font-size:clamp(18px,2.2vw,22px);color:#dfe5ff;max-width:860px}
.kicker{color:var(--yel);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:15px}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:center;min-height:calc(100vh - 60px)}
.hero svg{width:100%;max-width:420px;filter:drop-shadow(0 0 30px rgba(92,242,255,.35))}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;cursor:pointer;font:inherit;font-weight:800;font-size:19px;color:#071028;background:linear-gradient(90deg,var(--neon),#8affc1);padding:14px 26px;border-radius:999px;box-shadow:0 6px 24px rgba(92,242,255,.35);transition:transform .15s,box-shadow .15s;touch-action:manipulation;text-decoration:none}
.btn:hover{transform:translateY(-2px) scale(1.03)}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--txt);border:2px solid var(--line);box-shadow:none}
.btn.sm{font-size:16px;padding:9px 16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;transition:transform .25s,border-color .25s}
.card:hover{transform:translateY(-4px);border-color:rgba(92,242,255,.5)}
.card h3{margin:0 0 6px;font-size:22px}
.card p{margin:0;color:#d6dcff}
.dot{display:inline-block;width:22px;height:22px;border-radius:50%;vertical-align:-4px;margin-right:6px;box-shadow:0 0 12px currentColor}
.dot.p{background:var(--pro);color:var(--pro)}.dot.n{background:var(--neu);color:var(--neu)}.dot.e{background:var(--ele);color:var(--ele)}.dot.s{border:3px dashed var(--neon);color:transparent}
.split{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:center}
.note{background:linear-gradient(90deg,rgba(255,92,168,.15),rgba(92,242,255,.12));border:1px solid var(--line);border-radius:18px;padding:14px 18px;margin-top:18px}
.bohr{width:100%;max-width:340px;display:block;margin:0 auto}
.bohr .orbit{fill:none;stroke:rgba(92,242,255,.35);stroke-width:1.5;stroke-dasharray:4 5}
.bohr .el{fill:var(--ele);filter:url(#glow)}.bohr .el.out{fill:var(--yel)}
.bohr .pr{fill:var(--pro)}.bohr .nu{fill:var(--neu)}
.bohr text{font-weight:800;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.figcap{text-align:center;color:var(--mut);font-size:16px;margin-top:6px}
/* builder */
.builder{display:grid;grid-template-columns:1fr 1.1fr;gap:24px;align-items:start;margin-top:18px}
.ctrl{display:grid;gap:12px}
.ctrlrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 14px}
.ctrlrow .lab{flex:1;font-weight:800;font-size:20px}
.ctrlrow .num{min-width:52px;text-align:center;font-size:30px;font-weight:900}
.pm{width:54px;height:54px;border-radius:50%;border:none;font-size:30px;font-weight:900;cursor:pointer;color:#071028;touch-action:manipulation;transition:transform .1s}
.pm:active{transform:scale(.88)}
.pm.p{background:var(--pro)}.pm.n{background:var(--neu)}.pm.e{background:var(--ele)}
.readout{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px}
.bigsym{font-size:64px;font-weight:900;line-height:1;margin:4px 0}
.bigname{font-size:26px;font-weight:800}
.pill{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:800;font-size:16px;margin:4px 2px;background:rgba(255,255,255,.1)}
.pill.ok{background:rgba(105,219,124,.25);color:#b6ffc4}.pill.pos{background:rgba(255,77,109,.25);color:#ffc2cf}.pill.neg{background:rgba(77,216,255,.25);color:#c4f3ff}
.hint{font-size:16px;color:#d6dcff;margin-top:8px;min-height:2.6em}
.missions{display:grid;gap:8px}
.mission{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:16px}
.mission.done{border-color:#69db7c;background:rgba(105,219,124,.12)}
.mission .ck{font-size:20px;line-height:1.2}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
/* table */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:10px 4px 14px;margin:0 -4px}
.ptable{--c:clamp(34px,5.1vw,60px);display:grid;grid-template-columns:18px repeat(18,var(--c));grid-template-rows:18px repeat(7,var(--c)) 12px repeat(2,var(--c));gap:3px;width:max-content;margin:0 auto}
.ptable.mini{--c:clamp(24px,3.6vw,40px);gap:2px}
.ptable .lbl{font-size:11px;color:var(--mut);display:flex;align-items:center;justify-content:center;font-weight:800}
.cell{position:relative;border:1.5px solid var(--cc);background:color-mix(in srgb,var(--cc) 22%,transparent);background-color:rgba(255,255,255,.06);border-radius:8px;color:#fff;padding:0;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .15s,opacity .3s,box-shadow .2s,filter .3s;touch-action:manipulation;overflow:hidden;line-height:1}
@supports (background:color-mix(in srgb,red 20%,transparent)){.cell{background:color-mix(in srgb,var(--cc) 22%,transparent)}}
.cell:hover,.cell:focus-visible{transform:scale(1.18);z-index:3;box-shadow:0 0 18px var(--cc);outline:none}
.cell .cz{position:absolute;top:2px;left:3px;font-size:calc(var(--c)*.2);opacity:.85}
.cell .cs{font-weight:900;font-size:calc(var(--c)*.4)}
.cell .cn{font-size:calc(var(--c)*.15);opacity:.85;margin-top:2px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.mini .cell .cn,.mini .cell .cz{display:none}.mini .cell .cs{font-size:calc(var(--c)*.42)}
.cell.ph{cursor:default;opacity:.7;border-style:dashed}.cell.ph .cs{font-size:calc(var(--c)*.2)}
.cell.ph:hover{transform:none;box-shadow:none}
.ptable.dimmed .cell:not(.hi){opacity:.18;filter:grayscale(.7)}
.cell.hi{box-shadow:0 0 14px var(--cc),inset 0 0 10px var(--cc);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 26px var(--cc),inset 0 0 14px var(--cc)}}
.cell.good{--cc:#69db7c!important;animation:pop .5s}.cell.bad{--cc:#ff4d6d!important;animation:shake .4s}
@keyframes pop{50%{transform:scale(1.4)}}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.c-am{--cc:var(--am)}.c-ae{--cc:var(--ae)}.c-tm{--cc:var(--tm)}.c-pt{--cc:var(--pt)}.c-md{--cc:var(--md)}.c-nm{--cc:var(--nm)}.c-hl{--cc:var(--hl)}.c-ng{--cc:var(--ng)}.c-la{--cc:var(--la)}.c-ac{--cc:var(--ac)}
.legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 4px}
.legend button{font:inherit;font-size:15px;color:#fff;cursor:pointer;border:1.5px solid var(--cc);background:rgba(255,255,255,.05);border-radius:999px;padding:6px 12px;display:flex;align-items:center;gap:6px;touch-action:manipulation}
.legend button i{width:12px;height:12px;border-radius:50%;background:var(--cc);display:inline-block}
.legend button.on{background:var(--cc);color:#071028;font-weight:800}
.small{font-size:15px;color:var(--mut);text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.chip{font:inherit;font-weight:800;font-size:17px;min-width:52px;min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:#fff;cursor:pointer;padding:6px 12px;transition:.2s;touch-action:manipulation}
.chip.on{border-color:var(--neon);background:rgba(92,242,255,.2);box-shadow:0 0 16px rgba(92,242,255,.4)}
.infobox{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:16px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}
.pair .bohr{max-width:240px}
.scene{margin-top:12px;padding:14px;border-radius:16px;background:rgba(0,0,0,.25);text-align:center;font-size:20px;font-weight:800;overflow:hidden;position:relative;min-height:70px}
.scene .emo{display:inline-block;font-size:36px;margin:0 6px}
.zoom{animation:zoom 1.6s ease-in-out infinite alternate}@keyframes zoom{from{transform:translateX(-40px) rotate(-10deg)}to{transform:translateX(40px) rotate(10deg)}}
.boom{animation:boom 1s ease-in-out infinite}@keyframes boom{50%{transform:scale(1.5)}}
.zzz{animation:zzz 2.5s ease-in-out infinite}@keyframes zzz{50%{transform:translateY(-8px);opacity:.5}}
.yl{color:var(--yel);font-weight:800}
/* modal */
.modal{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(3,6,20,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:14px}
.modal.open{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.panel{position:relative;width:min(880px,100%);max-height:calc(100vh - 28px);overflow:auto;border-radius:26px;background:linear-gradient(160deg,#151f5c,#0a0f2e);border:2px solid var(--cc);box-shadow:0 0 50px color-mix(in srgb,var(--cc) 50%,transparent);padding:22px;animation:rise .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes rise{from{transform:translateY(30px) scale(.94);opacity:0}}
.panel .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:center}
.ptile{width:120px;height:120px;border-radius:20px;border:3px solid var(--cc);display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.06);box-shadow:0 0 24px var(--cc);position:relative}
.ptile .s{font-size:54px;font-weight:900;line-height:1}.ptile .z{position:absolute;top:6px;left:10px;font-weight:800}
.phead{display:flex;gap:18px;align-items:center}
.phead h3{margin:0;font-size:32px}.phead .alt{color:var(--mut);font-size:18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.stat{background:rgba(255,255,255,.06);border-radius:14px;padding:8px 12px}
.stat .k{font-size:14px;color:var(--mut)}.stat .v{font-size:22px;font-weight:900}
.fact{background:rgba(255,224,102,.1);border:1px solid rgba(255,224,102,.4);border-radius:16px;padding:12px 14px;margin-top:10px}
.fact b{color:var(--yel)}
.pnav{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.xbtn{position:absolute;top:12px;right:12px}
/* quiz */
.quizbox{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px;margin-top:16px}
.qtop{display:flex;justify-content:space-between;color:var(--mut);font-weight:800;font-size:16px}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin:8px 0 14px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--neon),var(--pink));transition:width .4s}
.qq{font-size:clamp(22px,3vw,30px);font-weight:800;margin:4px 0 14px}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-size:20px;text-align:left;padding:14px 18px;border-radius:16px;border:2px solid var(--line);background:rgba(255,255,255,.05);color:#fff;cursor:pointer;transition:.2s;touch-action:manipulation}
.opt:hover:not(:disabled){border-color:var(--neon);transform:translateX(4px)}
.opt.good{border-color:#69db7c;background:rgba(105,219,124,.25)}.opt.bad{border-color:#ff4d6d;background:rgba(255,77,109,.2)}
.fb{margin-top:14px;font-size:19px;min-height:1.5em}
.fb .r{color:#8cff9e;font-weight:900}.fb .w{color:#ff8fa3;font-weight:900}
.result{text-align:center}.result .trophy{font-size:90px;animation:bob 2s ease-in-out infinite;display:inline-block}
#confetti{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;pointer-events:none;z-index:100}
footer{text-align:center;color:var(--mut);padding:30px 10px 50px;font-size:16px}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}.reveal.vis{opacity:1;transform:none}
@media (max-width:820px){.hero,.split,.builder,.panel .grid{grid-template-columns:1fr}.hero{min-height:auto}.hero svg{max-width:300px;margin:0 auto;display:block}.logo{display:none}body{font-size:18px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<svg width="0" height="0" style="position:absolute"><defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs></svg>

</section>
<section class="reveal">

</section>
<section id="atom" class="reveal">
  <h2><span class="em">⚛️</span> <span data-t="atomTitle"></span></h2>

<section id="builder" class="reveal">
  <h2><span class="em">🔬</span> <span data-t="buildTitle"></span></h2>
  <p class="lead" data-t="buildLead"></p>
  <div class="builder">

      <div class="btnrow"><button class="btn sm ghost" id="bNeutral" data-t="makeNeutral"></button><button class="btn sm ghost" id="bCommon" data-t="makeCommon"></button><button class="btn sm ghost" id="bReset" data-t="reset"></button></div>

</section>

// ---------- Bohr model SVG (SMIL rotation = works in Safari/iPad too)
function bohrSVG(shells,p,n,opt){
  opt=opt||{};const N=shells.length,c=150,tot=p+n;
  const nucR=tot?Math.min(34,9+Math.sqrt(tot)*2.4):0;
  const r0=Math.max(nucR+16,38),rMax=142;
  const step=N>1?Math.min(34,(rMax-r0)/(N-1)):0;
  let s='<svg class="bohr" viewBox="0 0 300 300" role="img" aria-label="Bohr">';
  if(opt.title)s+='<title>'+opt.title+'</title>';
  shells.forEach((cnt,i)=>{
    const r=N===1?r0+12:r0+i*step;
    s+='<circle class="orbit" cx="150" cy="150" r="'+r.toFixed(1)+'"/>';
    const er=cnt>18?2.6:cnt>8?3.6:5.2;const outer=opt.outerHi&&i===N-1;
    s+='<g>';
    for(let k=0;k<cnt;k++){const a=2*Math.PI*k/cnt-Math.PI/2;s+='<circle class="el'+(outer?' out':'')+'" cx="'+(c+r*Math.cos(a)).toFixed(1)+'" cy="'+(c+r*Math.sin(a)).toFixed(1)+'" r="'+er+'"/>';}
    const dur=(6+i*3.5).toFixed(1),dir=i%2?-360:360;
    s+='<animateTransform attributeName="transform" type="rotate" from="0 150 150" to="'+dir+' 150 150" dur="'+dur+'s" repeatCount="indefinite"/></g>';
  });
  if(tot){
    const m=Math.min(tot,70),pr=Math.max(2.2,Math.min(8,nucR/Math.sqrt(m)*0.95));
    const pShow=Math.round(m*p/tot);
    // distribute protons evenly among the shown particles
    s+='<circle cx="150" cy="150" r="'+(nucR+4).toFixed(1)+'" fill="rgba(255,77,109,.12)"/><g>';
    let pc=0;
    for(let i=0;i<m;i++){
      const rr=(nucR-pr*0.6)*Math.sqrt((i+0.5)/m),th=i*2.39996;
      const isP=Math.floor((i+1)*pShow/m)>pc;if(isP)pc++;
      const x=c+rr*Math.cos(th),y=c+rr*Math.sin(th);
      s+='<circle class="'+(isP?'pr':'nu')+'" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+pr.toFixed(1)+'"/>';
      if(isP&&pr>=6)s+='<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" font-size="'+(pr*1.3).toFixed(1)+'">+</text>';
    }
    s+='<animateTransform attributeName="transform" type="rotate" values="0 150 150;4 150 150;-4 150 150;0 150 150" dur="1.2s" repeatCount="indefinite"/></g>';
  }
  return s+'</svg>';
}

  for(let p=1;p<=7;p++){const d=document.createElement("div");d.className="lbl";d.style.gridRow=p+1;d.style.gridColumn=1;d.textContent=p;host.appendChild(d)}

    b.style.gridRow=e.row;b.style.gridColumn=e.col;
    b.innerHTML='<span class="cz">'+e.z+'</span><span class="cs">'+e.sym+'</span><span class="cn">'+nm(e)+'</span>';
    b.title=nm(e)+" ("+e.sym+")";
    b.addEventListener("click",()=>opts.onClick(e,b));host.appendChild(b);
  });
}
function highlight(host,pred){
  const any=!!pred;host.classList.toggle("dimmed",any);
  host.querySelectorAll(".cell[data-z]").forEach(c=>c.classList.toggle("hi",any&&pred(EL[c.dataset.z-1])));
  host.querySelectorAll(".cell.ph").forEach(c=>c.classList.toggle("hi",any&&((c.classList.contains("c-la")&&pred(bySym.La))||(c.classList.contains("c-ac")&&pred(bySym.Ac)))));
}

// ---------- legend
let catOn=null;
function renderLegend(){
  const L=$("#legend");L.innerHTML="";
  ["am","ae","tm","pt","md","nm","hl","ng","la","ac"].forEach(c=>{
    const b=document.createElement("button");b.type="button";b.className="c-"+c+(catOn===c?" on":"");b.innerHTML="<i></i>"+t(c);
    b.onclick=()=>{catOn=catOn===c?null:c;highlight($("#mainTable"),catOn?e=>e.cat===catOn:null);renderLegend()};L.appendChild(b);
  });
}

// ---------- element panel
let curEl=null;
function factFor(e){
  if(FACTS[e.sym])return FACTS[e.sym][lang==="de"?0:1];
  let f=fmt(t("gen_"+e.cat),{n:nm(e)});
  if(e.z>=95)f+=" "+t("synth");
  return f;
}
function openEl(e,keep){
  curEl=e;const P=$("#panel");P.className="panel c-"+e.cat;
  const radio=e.mass.startsWith("(");
  const other=lang==="de"?e.en:e.de;
  P.innerHTML='<button class="btn sm ghost xbtn" id="xb">'+t("close")+'</button>'+
  '<div class="grid"><div>'+
   '<div class="phead"><div class="ptile"><span class="z">'+e.z+'</span><span class="s">'+e.sym+'</span></div><div><h3>'+nm(e)+'</h3><div class="alt">'+(lang==="de"?"EN: ":"DE: ")+other+'</div><span class="pill" style="background:var(--cc);color:#071028">'+t(e.cat)+'</span></div></div>'+
   '<div class="stats">'+
    '<div class="stat"><div class="k">'+t("atomicNo")+'</div><div class="v">'+e.z+'</div></div>'+
    '<div class="stat"><div class="k">'+t("massL")+'</div><div class="v">'+massTxt(e.mass)+'</div></div>'+
    '<div class="stat"><div class="k"><span class="dot p"></span>'+t("protons")+'</div><div class="v">'+e.z+'</div></div>'+
    '<div class="stat"><div class="k"><span class="dot n"></span>'+t("neutrons")+'</div><div class="v">'+(e.A-e.z)+'</div></div>'+
    '<div class="stat"><div class="k"><span class="dot e"></span>'+t("electrons")+'</div><div class="v">'+e.z+'</div></div>'+
    '<div class="stat"><div class="k">'+t("periodL")+' / '+t("groupL")+'</div><div class="v">'+e.period+' / '+(e.group||t("fGroup"))+'</div></div>'+
   '</div>'+
   '<div class="stat"><div class="k">'+t("shellsL")+'</div><div class="v">'+e.shells.join(" · ")+'</div></div>'+
   '<div class="fact"><b>💡 '+t("factL")+'</b><br>'+factFor(e)+'</div>'+
   '<p class="small" style="text-align:left;margin:8px 0 0">'+t("neutronNote")+(radio?' '+t("massNote"):'')+(e.z>=104?' '+t("predicted"):'')+'</p>'+
  '</div><div>'+bohrSVG(e.shells,e.z,e.A-e.z,{title:nm(e)})+
   '<div class="pnav"><button class="btn sm ghost" id="pv" '+(e.z===1?'disabled':'')+'>◀ '+(e.z>1?EL[e.z-2].sym:'')+'</button><button class="btn sm ghost" id="nx" '+(e.z===118?'disabled':'')+'>'+(e.z<118?EL[e.z].sym:'')+' ▶</button></div>'+
  '</div></div>';
  $("#xb").onclick=closeEl;
  $("#pv").onclick=()=>e.z>1&&openEl(EL[e.z-2]);$("#nx").onclick=()=>e.z<118&&openEl(EL[e.z]);
  const M=$("#modal");if(!M.classList.contains("open")){M.classList.add("open");}
  if(!keep)P.scrollTop=0;
}
function closeEl(){curEl=null;$("#modal").classList.remove("open")}
$("#modal").addEventListener("click",ev=>{if(ev.target.id==="modal")closeEl()});
document.addEventListener("keydown",ev=>{if(!curEl)return;if(ev.key==="Escape")closeEl();if(ev.key==="ArrowRight"&&curEl.z<118)openEl(EL[curEl.z]);if(ev.key==="ArrowLeft"&&curEl.z>1)openEl(EL[curEl.z-2])});

// ---------- atom builder
const B={p:1,n:0,e:1};const MAX={p:118,n:180,e:118};
const MISSIONS=[s=>s.p===2&&s.n===2&&s.e===2,s=>s.p===6&&s.n===6&&s.e===6,s=>s.p===11&&s.n===12&&s.e===10,s=>s.p===8&&s.n===8&&s.e===8];
const mDone=[false,false,false,false];
function renderBuilder(){
  $("#np").textContent=B.p;$("#nn").textContent=B.n;$("#ne").textContent=B.e;
  const shells=B.e?EL[B.e-1].shells:[];
  $("#bAtom").innerHTML=bohrSVG(shells,B.p,B.n);
  let h="";
  if(!B.p){h='<div class="bigsym">?</div><div class="hint">'+t("noElement")+'</div>';}
  else{
    const e=EL[B.p-1],q=B.p-B.e,cn=e.A-e.z;
    const qs=q===0?'<span class="pill ok">'+t("charge")+': 0 · '+t("neutral")+'</span>':q>0?'<span class="pill pos">'+t("charge")+': +'+q+' · '+t("posIon")+'</span>':'<span class="pill neg">'+t("charge")+': −'+(-q)+' · '+t("negIon")+'</span>';
    let hint;
    if(B.n===cn)hint=fmt(t(e.mass.startsWith("(")?"commonR":"common"),{name:nm(e)});
    else if(Math.abs(B.n-cn)<=Math.max(2,Math.round(cn*0.1)))hint=fmt(t("isotope"),{n:cn});
    else hint=fmt(t("unstable"),{n:cn});
    h='<div class="bigsym" style="color:var(--'+e.cat+')">'+e.sym+(q?'<sup style="font-size:.45em">'+(Math.abs(q)>1?Math.abs(q):'')+(q>0?'+':'−')+'</sup>':'')+'</div><div class="bigname">'+nm(e)+'</div>'+qs+'<span class="pill">'+t("massNo")+': '+(B.p+B.n)+'</span><div class="hint">'+hint+'</div>';
  }
  $("#bInfo").innerHTML=h;
  // missions
  const box=$("#missions");box.innerHTML="";
  MISSIONS.forEach((f,i)=>{if(!mDone[i]&&f(B)){mDone[i]=true;burst(60)}
    const d=document.createElement("div");d.className="mission"+(mDone[i]?" done":"");d.innerHTML='<span class="ck">'+(mDone[i]?"✅":"⬜")+'</span><span>'+t("m"+i)+(mDone[i]?' <b>'+t("missionDone")+'</b>':'')+'</span>';box.appendChild(d)});
  if(mDone.every(x=>x)){const d=document.createElement("div");d.className="mission done";d.innerHTML='<span>'+t("allMissions")+'</span>';box.appendChild(d)}
}
document.querySelectorAll(".pm").forEach(b=>b.addEventListener("click",()=>{const k=b.dataset.k;B[k]=Math.max(0,Math.min(MAX[k],B[k]+Number(b.dataset.d)));renderBuilder()}));
$("#bNeutral").onclick=()=>{B.e=B.p;renderBuilder()};
$("#bCommon").onclick=()=>{if(B.p){B.n=EL[B.p-1].A-B.p;renderBuilder()}};
$("#bReset").onclick=()=>{B.p=1;B.n=0;B.e=1;renderBuilder()};

// ---------- periods
let selP=2;
function renderPeriod(){
  const C=$("#periodChips");C.innerHTML="";
  for(let p=1;p<=7;p++){const b=document.createElement("button");b.type="button";b.className="chip"+(p===selP?" on":"");b.textContent=t("periodBtn")+" "+p;b.onclick=()=>{selP=p;renderPeriod()};C.appendChild(b)}
  highlight($("#periodTable"),e=>e.period===selP);
  const [a,b]=PERIOD_PAIRS[selP].map(s=>bySym[s]);
  $("#periodInfo").innerHTML='<p style="margin-top:0">'+fmt(t("rowsInfo"),{p:selP,pl:selP>1?t("plural"):""})+'</p><div class="pair">'+
   [a,b].map(e=>'<div>'+bohrSVG(e.shells,e.z,e.A-e.z)+'<div class="figcap"><b>'+nm(e)+' ('+e.sym+')</b> · '+e.shells.join(" · ")+'</div></div>').join("")+'</div><p class="figcap">'+fmt(t("rowsCompare"),{a:nm(a),b:nm(b),p:selP})+'</p>';
}
// ---------- groups
let selG=1;
function renderGroup(){
  const C=$("#groupChips");C.innerHTML="";
  for(let g=1;g<=18;g++){const b=document.createElement("button");b.type="button";b.className="chip"+(g===selG?" on":"");b.textContent=g;b.title=t("groupBtn")+" "+g;b.onclick=()=>{selG=g;renderGroup()};C.appendChild(b)}
  highlight($("#groupTable"),e=>e.group===selG);
  const tm=selG>=3&&selG<=12;
  const nameK=tm?"gTmn":"g"+selG+"n",txtK=tm?"gTm":"g"+selG;
  const outerN=selG<=2?selG:selG-10;
  let h='<h3 style="margin:0 0 6px;font-size:26px">'+t("groupBtn")+' '+selG+': '+t(nameK)+'</h3><p style="margin:0 0 6px">'+t(txtK)+'</p><span class="pill">'+(tm?t("outerTm"):fmt(t("outer"),{n:outerN+(selG===18?" (He: 2)":"")}))+'</span>';
  const scene={1:'<span class="emo">💧</span><span class="emo zoom">🔘</span><span class="emo boom">💥</span><br>'+t("s1"),17:'<span class="emo">🔘</span> + <span class="emo">🟢</span> → <span class="emo boom">🧂</span><br>'+t("s17"),18:'<span class="emo zzz">😴</span><span class="emo zzz" style="animation-delay:.6s">💤</span><span class="emo">💡</span><br>'+t("s18"),2:'<span class="emo zzz">🦴</span><span class="emo">🥛</span><br>'+t("s2"),13:'<span class="emo zzz">🥫</span><br>'+t("s13"),14:'<span class="emo zzz">🌱</span><span class="emo zzz" style="animation-delay:.5s">💻</span><span class="emo">💎</span><br>'+t("s14"),15:'<span class="emo zzz">🌬️</span><br>'+t("s15"),16:'<span class="emo boom">🔥</span><span class="emo">🫁</span><br>'+t("s16")};
  h+='<div class="scene">'+(scene[selG]||'<span class="emo zzz">⚙️</span><span class="emo boom">⚡</span><span class="emo">🔩</span><br>'+t("sTm"))+'</div>';
  if(GROUP_PAIRS[selG]){const [a,b]=GROUP_PAIRS[selG].map(s=>bySym[s]);
    h+='<div class="pair">'+[a,b].map(e=>'<div>'+bohrSVG(e.shells,e.z,e.A-e.z,{outerHi:true})+'<div class="figcap"><b>'+nm(e)+' ('+e.sym+')</b> · '+e.shells.join(" · ")+'</div></div>').join("")+'</div><p class="figcap">'+fmt(t("colsCompare"),{a:nm(a),b:nm(b)})+'</p>';}
  $("#groupInfo").innerHTML=h;
}

// ---------- quiz
const Q={i:-1,score:0,answered:false,order:[],picked:null};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(){Q.i=0;Q.score=0;Q.answered=false;Q.picked=null;Q.order=QUIZ.map(q=>q.type==="mc"?shuffle([0,1,2]):null);renderQuiz()}
function renderQuiz(){
  const box=$("#quizBox");
  if(Q.i<0){box.innerHTML='<div class="result"><div class="trophy">🧠</div><br><button class="btn" id="qs">'+t("qStart")+'</button></div>';$("#qs").onclick=startQuiz;return}
  if(Q.i>=QUIZ.length){
    const n=QUIZ.length,s=Q.score,msg=s>=9?t("r3"):s>=6?t("r2"):t("r1");
    box.innerHTML='<div class="result"><div class="trophy">'+(s>=9?"🏆":s>=6?"🥈":"🌟")+'</div><h3 style="font-size:32px;margin:6px 0">'+t("resultTitle")+'</h3><p class="lead" style="margin:0 auto">'+fmt(t("result"),{s,n})+'</p><p style="font-size:22px">'+msg+'</p><button class="btn" id="qr">'+t("restart")+'</button></div>';
    $("#qr").onclick=startQuiz;return;
  }
  const q=QUIZ[Q.i],L=q[lang];
  let h='<div class="qtop"><span>'+fmt(t("qOf"),{i:Q.i+1,n:QUIZ.length})+'</span><span>'+fmt(t("qScore"),{s:Q.score})+'</span></div><div class="bar"><i style="width:'+(Q.i/QUIZ.length*100)+'%"></i></div><div class="qq">'+L.q+'</div>';
  if(q.type==="mc"){h+='<div class="opts">'+Q.order[Q.i].map(k=>'<button class="opt" data-k="'+k+'">'+L.o[k]+'</button>').join("")+'</div>'}
  else h+='<p style="margin:0 0 6px;color:var(--mut)">'+t("tapTable")+'</p><div class="tablewrap"><div id="quizTable"></div></div>';
  h+='<div class="fb" id="fb"></div><div id="qn"></div>';
  box.innerHTML=h;
  if(q.type==="mc"){
    box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(Number(b.dataset.k)===q.a,b));
  }else{
    buildTable($("#quizTable"),{mini:true,onClick:(e,b)=>{if(Q.answered)return;Q.picked=e.z;answer(q.ok(e),b,e)}});
  }
  if(Q.answered)showFeedback();
}
function answer(ok,btn,e){
  if(Q.answered)return;Q.answered=true;Q.lastOk=ok;Q.lastName=e?nm(e)+" ("+e.sym+")":null;if(ok){Q.score++;burst(40)}
  Q.lastBtn=btn?(btn.dataset.k||btn.dataset.z):null;showFeedback();
}
function showFeedback(){
  const q=QUIZ[Q.i],L=q[lang],box=$("#quizBox");
  if(q.type==="mc"){box.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const k=Number(b.dataset.k);if(k===q.a)b.classList.add("good");else if(String(k)===Q.lastBtn)b.classList.add("bad")})}
  else{const tb=$("#quizTable");q.show.forEach(z=>{const c=tb.querySelector('[data-z="'+z+'"]');if(c)c.classList.add("good")});if(!Q.lastOk&&Q.picked){const c=tb.querySelector('[data-z="'+Q.picked+'"]');if(c)c.classList.add("bad")}}
  $("#fb").innerHTML=(Q.lastOk?'<span class="r">'+t("right")+'</span> ':'<span class="w">'+t("wrong")+'</span> ')+(Q.lastName&&!Q.lastOk?fmt(t("youClicked"),{name:Q.lastName})+' ':'')+L.x;
  const last=Q.i===QUIZ.length-1;
  $("#qn").innerHTML='<button class="btn" id="qnb" style="margin-top:12px">'+(last?t("finish"):t("nextQ"))+'</button>';
  $("#qnb").onclick=()=>{Q.i++;Q.answered=false;Q.picked=null;renderQuiz();if(Q.i>=QUIZ.length)celebrate();$("#quiz").scrollIntoView({behavior:"smooth",block:"start"})};
}

// ---------- confetti
const cv=$("#confetti"),cx=cv.getContext("2d");let parts=[],raf=null;
function sizeCv(){const r=window.devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;cx.setTransform(r,0,0,r,0,0)}
addEventListener("resize",sizeCv);sizeCv();
function burst(n,x,y){
  const cols=["#5cf2ff","#ff5ca8","#ffe066","#69db7c","#9775fa","#ffa94d"];
  for(let i=0;i<n;i++)parts.push({x:x!==undefined?x:innerWidth/2,y:y!==undefined?y:innerHeight*0.45,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[i%cols.length],life:140+Math.random()*60});
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+40);
  raf=parts.length?requestAnimationFrame(tick):(cx.clearRect(0,0,innerWidth,innerHeight),null);
}
function celebrate(){let k=0;const iv=setInterval(()=>{burst(70,Math.random()*innerWidth,innerHeight*0.3);if(++k>5)clearInterval(iv)},280)}

// ---------- reveal + nav highlight
const io="IntersectionObserver" in window?new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting)en.target.classList.add("vis")}),{threshold:.08}):null;
document.querySelectorAll(".reveal").forEach(s=>io?io.observe(s):s.classList.add("vis"));
const navIo="IntersectionObserver" in window?new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+en.target.id))}}),{rootMargin:"-45% 0px -50% 0px"}):null;
document.querySelectorAll("main section[id]").forEach(s=>navIo&&navIo.observe(s));

// ---------- init
$("#heroAtom").innerHTML=bohrSVG([2,8,8,2],20,20,{title:"Calcium"});
$("#demoAtom").innerHTML=bohrSVG([2,1],3,4,{outerHi:false,title:"Lithium"});
buildTable($("#mainTable"),{onClick:e=>openEl(e)});
buildTable($("#periodTable"),{mini:true,onClick:e=>{selP=e.period;renderPeriod()}});
buildTable($("#groupTable"),{mini:true,onClick:e=>{if(e.group){selG=e.group;renderGroup()}else openEl(e)}});
$("#lde").onclick=()=>setLang("de");$("#len").onclick=()=>setLang("en");
applyLang();
</script>
